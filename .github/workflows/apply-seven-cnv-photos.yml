name: Apply seven CNV photos correctly
on:
  push:
    paths: ['.github/workflows/apply-seven-cnv-photos.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          mapping={'vision':'Vision.jpg','experience':'Experience.jpg','village':'TheVillage.jpg','artdevivre':'ArtdeVivre.jpg','tech':'NaturexTech.jpg','joincnv':'Join.jpg'}
          for section,filename in mapping.items():
            assert Path(filename).is_file()
            i=s.index('id="'+section+'"')
            visual=s.index('<div class="editorialVisual"><img',i)
            assert visual-i<5000,(section,visual-i)
            src=s.index('src="',visual)+5
            end=s.index('"',src)
            assert end-src<400
            s=s[:src]+filename+s[end:]
            print('PASS',section,filename)
          for m in re.finditer(r'<section[^>]*id="([^"]+)"',s):
            if 'member' in m.group(1).lower():print('MEMBERSHIP ID',m.group(1))
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m 'Apply six uploaded CNV section photos'
          git pull --rebase origin main
          git push
