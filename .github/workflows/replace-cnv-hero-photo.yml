name: Replace CNV TEST home hero photo
on:
  push:
    paths: ['.github/workflows/replace-cnv-hero-photo.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='url("https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=2400&q=92") center/cover'
          new='url("cnv-hero.jpg") center/cover'
          assert s.count(old)==1,s.count(old)
          assert Path('cnv-hero.jpg').read_bytes()[:3]==b'\xff\xd8\xff'
          s=s.replace(old,new,1)
          p.write_text(s)
          assert s.count(new)==1
          print('PASS hero now uses uploaded cnv-hero.jpg; other sections unchanged')
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m 'Use uploaded Andalusian sunset as home hero background'
          git pull --rebase origin main
          git push
