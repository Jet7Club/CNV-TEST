name: Inspect generator tail
on:
  push:
    paths: ['.github/workflows/inspect-generator-tail.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('function makeDay(')
          print(s[a:a+10500])
          PY
