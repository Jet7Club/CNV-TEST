name: Update investor price
on:
  push:
    paths:
      - .github/workflows/update-investor-price.yml
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old="500 000 € + par Investor"
          new="1 000 000 € +"
          print("Found:",s.count(old))
          assert s.count(old)>0
          s=s.replace(old,new)
          p.write_text(s)
          print("Updated:",s.count(new))
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m "Update investor minimum participation"
          git push
