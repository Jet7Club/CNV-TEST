name: Remove overlay photo backgrounds
on:
  push:
    paths: ['.github/workflows/remove-overlay-backgrounds.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<style id="cnv-no-overlay-images">#vision::before,#village::before,#artdevivre::before,#tech::before,#destinations::before{content:none!important;display:none!important;background-image:none!important}</style>'
          assert '#vision:before{background-image:' in s
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove five overlaid decorative photo backgrounds"
          git pull --rebase origin main
          git push
