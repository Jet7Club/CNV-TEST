name: Fix CNV TEST ideal day layout
on:
  push:
    paths: ['.github/workflows/fix-ideal-day-layout.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct overlapping cards and limit sixteen moments to nine words
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="cnvDayStudio"' in s and 'id="cnvIdealDayTimeline"' in s
          css="""
          <style id="cnv-test-ideal-day-no-overlap">
          /* Keep the three day-builder panels in their own grid cells. */
          #artdevivre #cnvDayStudio{
            display:grid!important;
            grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.25fr)!important;
            gap:clamp(18px,2vw,28px)!important;
            align-items:start!important;
            width:100%!important;max-width:100%!important;
            margin:32px auto 0!important;padding:0!important;
            box-sizing:border-box!important;overflow:visible!important;
          }
          #artdevivre #cnvDayStudio>.cnvDaySide,
          #artdevivre #cnvDayStudio>.quickBuilder,
          #artdevivre #cnvDayStudio>.cnvDayRight{
            position:relative!important;top:auto!important;left:auto!important;right:auto!important;
            float:none!important;transform:none!important;
            width:100%!important;min-width:0!important;max-width:100%!important;
            margin:0!important;align-self:start!important;box-sizing:border-box!important;
            border-radius:20px!important;padding:clamp(18px,2vw,26px)!important;
            background:#fff!important;border:1px solid #e4e9df!important;
            box-shadow:0 12px 34px rgba(19,55,38,.07)!important;
            overflow:visible!important;
          }
          #artdevivre #cnvDayStudio>.cnvDaySide{grid-column:1!important;grid-row:1!important}
          #artdevivre #cnvDayStudio>.quickBuilder{grid-column:2!important;grid-row:1!important}
          #artdevivre #cnvDayStudio>.cnvDayRight{grid-column:3!important;grid-row:1!important}
          #artdevivre #cnvDayStudio .qbChoices{display:flex!important;flex-wrap:wrap!important;gap:8px!important}
          #artdevivre #cnvDayStudio .qbChoices button{white-space:normal!important;max-width:100%!important}
          #artdevivre #cnvIdealDayTimeline{display:grid!important;grid-template-columns:minmax(0,1fr)!important;
            gap:8px!important;width:100%!important;margin:14px 0 0!important;overflow:visible!important}
          #artdevivre #cnvIdealDayTimeline .cnvDaySlot{
            display:grid!important;grid-template-columns:48px 24px minmax(0,1fr)!important;
            align-items:center!important;gap:9px!important;
            position:relative!important;left:auto!important;top:auto!important;
            width:100%!important;max-width:100%!important;min-height:58px!important;
            padding:10px 12px!important;margin:0!important;box-sizing:border-box!important;
            text-align:left!important;transform:none!important;overflow:visible!important;
          }
          #artdevivre #cnvIdealDayTimeline .cnvDaySlot .slotTime{font-size:11px!important;white-space:nowrap!important;margin:0!important}
          #artdevivre #cnvIdealDayTimeline .cnvDaySlot .slotIcon{font-size:18px!important;margin:0!important}
          #artdevivre #cnvIdealDayTimeline .cnvDaySlot .slotTitle{
            position:static!important;display:block!important;min-width:0!important;
            font-size:12px!important;line-height:1.45!important;font-weight:650!important;
            white-space:normal!important;overflow-wrap:break-word!important;
            word-break:normal!important;opacity:1!important;visibility:visible!important;
            transform:none!important;margin:0!important;
          }
          @media(max-width:1100px){
            #artdevivre #cnvDayStudio{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            #artdevivre #cnvDayStudio>.cnvDaySide{grid-column:1!important;grid-row:1!important}
            #artdevivre #cnvDayStudio>.quickBuilder{grid-column:2!important;grid-row:1!important}
            #artdevivre #cnvDayStudio>.cnvDayRight{grid-column:1/-1!important;grid-row:2!important}
          }
          @media(max-width:700px){
            #artdevivre #cnvDayStudio{grid-template-columns:minmax(0,1fr)!important;gap:16px!important}
            #artdevivre #cnvDayStudio>.cnvDaySide{grid-column:1!important;grid-row:1!important}
            #artdevivre #cnvDayStudio>.quickBuilder{grid-column:1!important;grid-row:2!important}
            #artdevivre #cnvDayStudio>.cnvDayRight{grid-column:1!important;grid-row:3!important}
          }
          </style>
          """
          js="""
          <script id="cnv-test-nine-words-per-moment">
          (function(){
            const original=new WeakMap();
            function limit(){
              const root=document.getElementById('cnvIdealDayTimeline');if(!root)return;
              root.querySelectorAll('.cnvDaySlot .slotTitle').forEach(function(el){
                const current=el.textContent.trim().replace(/\\s+/g,' ');
                const previous=original.get(el);
                // If the generator produced a new description, preserve it before shortening.
                if(!previous||current!==previous.short){
                  const words=current.split(/\\s+/).filter(Boolean);
                  const short=words.length>9?words.slice(0,9).join(' ')+'…':current;
                  original.set(el,{full:current,short:short});
                  if(short!==current){el.textContent=short;el.title=current}
                  else el.removeAttribute('title');
                }
              });
            }
            function init(){
              const root=document.getElementById('cnvIdealDayTimeline');if(!root)return;
              let working=false;
              const observer=new MutationObserver(function(){
                if(working)return;
                working=true;observer.disconnect();limit();
                observer.observe(root,{subtree:true,childList:true,characterData:true});
                working=false;
              });
              limit();observer.observe(root,{subtree:true,childList:true,characterData:true});
              document.getElementById('langSelect')?.addEventListener('change',function(){requestAnimationFrame(limit)});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>
          """
          assert s.count('</head>')==1 and s.count('</body>')==1
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('</body>',js+'\n</body>',1)
          assert s.count('cnv-test-ideal-day-no-overlap')==1
          assert s.count('cnv-test-nine-words-per-moment')==1
          Path('index.html').write_text(s,encoding='utf-8')
          print('CHECK OK: responsive 3/2/1 columns, 16 cards constrained, max 9 words each')
          PY
      - name: Commit CNV TEST only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix overlapping ideal-day cards and cap each moment at nine words"
          git pull --rebase origin main
          git push
