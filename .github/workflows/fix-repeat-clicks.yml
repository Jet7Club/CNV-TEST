name: Ensure every CNV day click updates moments
on:
  push:
    paths: ['.github/workflows/fix-repeat-clicks.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          a="function makeDay(selection,scenarioId){"
          assert s.count(a)==1
          s=s.replace(a,"let cnvDayRevision=0;\n"+a,1)
          old="seed=hash(k.join('|')+'|'+(scenarioId>=0?scenarioId:'live'))"
          assert s.count(old)==1
          s=s.replace(old,"seed=hash(k.join('|')+'|'+(scenarioId>=0?scenarioId:'live')+'|'+cnvDayRevision)",1)
          old="currentScenario=-1;selector.value='';\n document.getElementById('cnvScenarioClicks').textContent='';"
          assert s.count(old)==1
          s=s.replace(old,"currentScenario=-1;selector.value='';\n cnvDayRevision++;\n document.getElementById('cnvScenarioClicks').textContent='';",1)
          p.write_text(s)
          print('Every click now advances the day variation seed, including repeated selected choices')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Regenerate ideal day on every click, including already-selected options"
          git pull --rebase origin main
          git push
