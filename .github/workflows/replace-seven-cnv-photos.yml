name: Replace seven CNV section photos
on:
  push:
    paths: ['.github/workflows/replace-seven-cnv-photos.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          mapping={'vision':'Vision.jpg','experience':'Experience.jpg','village':'TheVillage.jpg','artdevivre':'ArtdeVivre.jpg','tech':'NaturexTech.jpg','joincnv':'Join.jpg'}
          for section,filename in mapping.items():
            assert Path(filename).is_file(),filename
            pattern=r'(<section\\b[^>]*\\bid="'+section+r'"[^>]*>[\\s\\S]*?<div class="editorialVisual"><img\\b[^>]*?\\bsrc=")[^"]+(")'
            new,n=re.subn(pattern,lambda m:m.group(1)+filename+m.group(2),s,count=1)
            assert n==1,(section,n)
            s=new
            print('PASS',section,filename)
          for m in re.finditer(r'<section\\b[^>]*\\bid="([^"]+)"',s):
            if 'member' in m.group(1).lower():
              print('MEMBERSHIP ID',m.group(1))
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m 'Replace six main CNV section images'
          git pull --rebase origin main
          git push
