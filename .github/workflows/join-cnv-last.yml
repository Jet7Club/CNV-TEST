name: Put Join CNV last in navigation
on:
  push:
    paths: ['.github/workflows/join-cnv-last.yml']
permissions:
  contents: write
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<a data-i18n="i6" href="#joincnv">Join CNV</a><a data-i18n="i7" href="#destinations">Destinations</a>'
          new='<a data-i18n="i7" href="#destinations">Destinations</a><a data-i18n="i6" href="#joincnv">Join CNV</a>'
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          assert s.count(new)==1
          print('PASS: Destinations then Join CNV; translation IDs retained')
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m 'Move Join CNV to last navigation position'
          git pull --rebase origin main
          git push
