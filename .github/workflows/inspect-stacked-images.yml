name: Inspect stacked images CNV TEST
on:
  push:
    paths: ['.github/workflows/inspect-stacked-images.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          for term in ['<img','background-image','floating','collage','mini','overlap','stack','photo']:
            matches=list(re.finditer(re.escape(term),s,re.I))
            print('TERM',term,'COUNT',len(matches))
            for m in matches[:10]:print('SNIP',repr(s[max(0,m.start()-140):m.start()+350]))
          PY
