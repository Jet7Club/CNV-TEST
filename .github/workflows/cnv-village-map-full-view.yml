name: CNV village map full view
on:
  push:
    paths: ['.github/workflows/cnv-village-map-full-view.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          rule='''<style id="cnv-village-map-full-view">
          #village .editorialVisual {height:auto !important;min-height:0 !important;aspect-ratio:auto !important;overflow:visible !important}
          #village .editorialVisual img {display:block;width:100% !important;height:auto !important;max-height:none !important;object-fit:contain !important;object-position:center !important;aspect-ratio:auto !important}
          </style>'''
          if 'id="cnv-village-map-full-view"' not in s:
            assert '</head>' in s
            s=s.replace('</head>',rule+'</head>',1)
          assert 'id="village"' in s
          p.write_text(s)
          print('PASS full village image visible without cropping')
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m 'Show entire village plan without cropping'
          git pull --rebase origin main
          git push
