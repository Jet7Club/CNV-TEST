name: Set investor participation to one million
on:
  push:
    paths:
      - .github/workflows/set-investor-one-million.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='[tx.participation,"500 000 € +"]'
          new='[tx.participation,"1 000 000 € +"]'
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new)
          p.write_text(s)
          print('PASS: investor table updated')
          PY
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m "Update investor participation to 1 million euros"
          git push
