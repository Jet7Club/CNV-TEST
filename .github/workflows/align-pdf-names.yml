name: Align CNV PDF links with renamed files
on:
  push:
    paths: ['.github/workflows/align-pdf-names.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          mapping={'CNV_Reglement_Interieur_Premium_FR_Sans_Signature.pdf':'CNV_Reglement_Interieur_FR.pdf','CNV_Community_Charter_Premium_EN_No_Signature.pdf':'CNV_Community_Charter_EN.pdf','CNV_Reglamento_Interno_Premium_ES_Sin_Firma.pdf':'CNV_Reglamento_Interno_ES.pdf'}
          for old,new in mapping.items():
            assert Path(new).read_bytes()[:4]==b'%PDF',new
            assert old in s,old
            s=s.replace(old,new)
            print('OK',new)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update charter links to renamed PDF files'
          git pull --rebase origin main
          git push
