name: Inspect CNV labels
on:
  push:
    paths: ['.github/workflows/inspect-labels.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for x in ['26 zones','Carte vivante','Quelques clics pour composer','Micro-villages','return result.map']:
            print('LABEL',x,s.count(x))
            i=s.find(x)
            if i>=0:print(repr(s[max(0,i-180):i+400]))
          PY
